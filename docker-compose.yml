services:
  postgres:
    image: postgres:16-alpine
    container_name: leon-blog-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leon_blog
    ports:
      - "5432:5432"
    volumes:
      - leon_blog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leon_blog"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Integration tests use a separate database so they never touch dev data.
  postgres-test:
    image: postgres:16-alpine
    container_name: leon-blog-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leon_blog_test
    ports:
      - "5433:5432"
    volumes:
      - leon_blog_pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leon_blog_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  leon_blog_pgdata:
  leon_blog_pgdata_test:
